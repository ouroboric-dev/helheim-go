# The Go flavor of the Helheim realm (change realm-leaf-naming): the recipe of a Go API leaf and
# the services it needs, by name: `needs` asks for a database and a store, and the runtime realm
# (Niflheim) provides them. It has no graph: a run takes its graph from the graph pack it names (Voluspa's
# software for the client gallery). The check ladder is rungs 1 to 5 of spec §9.5, with the dependency policy
# (deps) and the two-tenant authorisation harness (authz) beside the security rung; the
# reviewers (rung 6) are the graph's, and rung 7 is the grader's.
name: helheim-go
version: 0.1.0
checks:
  static: [/opt/ygg/checks/go-static.sh]
  unit: [/opt/ygg/checks/go-unit.sh]
  tdd: [/opt/ygg/checks/go-tdd.sh]
  contract: [/opt/ygg/checks/go-contract.sh]
  deps: [/opt/ygg/checks/go-deps.sh]
  security: [/opt/ygg/checks/go-security.sh]
  authz: [/opt/ygg/checks/go-authz.sh]
  integration: [/opt/ygg/checks/go-integration.sh]
leaf:
  description: A Go HTTP API that owns its OpenAPI contract
  template: templates/api
  first_commit: [LICENSE]
  implementer: prompts/implementer.md
  checks: [static, unit, tdd, contract, deps, security, authz, integration]
needs: [postgres, s3]
sandbox:
  build: devcontainer
  egress: [proxy.golang.org, sum.golang.org, vuln.go.dev, api.osv.dev]
